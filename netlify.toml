# 개척 지도 — site.zip 을 풀어서 배포 (업데이트는 site.zip 한 파일만 교체)
[build]
  command = "rm -rf build && mkdir -p build && unzip -o -q site.zip -d build && cd build && npm install --omit=dev --no-audit --no-fund"
  publish = "build/public"

[functions]
  directory = "build/netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
